<form ng-submit="verifyOTP()" style="display: flex; gap: 10px">
  <input
    type="text"
    ng-model="otp"
    placeholder="Enter OTP"
    required
    style
    border
  />
  <button type="submit" class="btn btn-primary">Verify OTP</button>
  <button type="button" class="btn btn-secondary" ng-click="resendOTP()">
    Resend OTP
  </button>
</form>
